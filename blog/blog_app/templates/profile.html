{% extends "test.html" %}
{% block title %}
your profile
{% endblock  %}

{% block content %}
{%load static%}
<link rel='stylesheet' href='{% static "css/profile.css" %}'>
<div class='profile-container'>
<h2>Your Profile</h2>
{%if user.profile.profile_img %}
<img src='{{ user.profile.img_picture.url }}' alt='profile image' class='profile-pic'>
{% endif %}
<form method='post' enctype='multipart/form-data'>
{% csrf_token %}
{{form}}

<button type='submit'>Update Profile</button>
</form>
</div>
{% endblock  %}
