<!DOCTYPE html>
<html>
<head>
<meta name='viewport' content='width=device-width, initialscale=1.0'>
{%load static %}
<link rel='stylesheet' href='{% static "css/base.css" %}'>
<div class='container'>
  <nav class='navbar'>
       <a class='boston' href='{% url "posts" %}' class='home'>My BLOG</a>
       <img src='{% static "img/img_day2.jpg" %}' alt='blog image'>
           <div class='nav-buttons'>
                {%if user.is_authenticated %}
                <a href="{% url 'create_post' %}"><button  class='boston' type='button'>Create Post</button></a>
                <a href='{% url "profile" %}'><button type='button' class='boston'>Profile</button></a>
                <a href='{% url "log_out" %}'><button class='boston' type='button'>Log out</button></a>
                {% endif %}
                {%if not user.is_authenticated %}
                <a  href='{% url "sign_up" %}'><button class='boston' type='button'>Sign Up</button></a>
                <a  href='{% url "log_in" %}'><button class='boston' type='button'>Log in</button>
                {% endif %}
            </div>
       </a>
   <nav>
</div>

<title>{% block title %}
Just testing my project
{% endblock  %}</title>
</head>

<body>
{% block  content%}

{% endblock  %}
</div>
</body>
</html>
